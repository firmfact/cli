# golangci-lint v2; CI runs the version pinned in .github/workflows/ci.yml.
# Run it locally with `golangci-lint run`.
version: "2"

linters:
  # On top of the standard set (errcheck, govet, ineffassign, staticcheck,
  # unused): the checks that matter for a CLI that holds tokens, talks HTTP
  # and replaces its own binary.
  enable:
    - bodyclose
    - errorlint
    - gosec
    - noctx
    - staticcheck
  settings:
    errcheck:
      exclude-functions:
        # Writes to the terminal. If stdout or stderr is gone there is
        # nobody left to tell.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        # Closing a response body (or an archive entry) once it has been
        # read: the read already said whatever went wrong.
        - (io.ReadCloser).Close
    gosec:
      excludes:
        # Every file the CLI reads is at a path it built itself, under the
        # user's config, cache or home directory, or one the user named on
        # the command line; none comes from the server.
        - G304
        # Unchecked errors are errcheck's job, with the exclusions above.
        - G104
    staticcheck:
      checks:
        # The standard set, as golangci-lint enables it by default.
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # Rewriting !(a && b) by De Morgan's law makes the conditions it
        # flags here harder to read, not easier.
        - -QF1001
  exclusions:
    rules:
      # Tests pick their own paths and permissions, redirect on purpose and
      # talk to servers that live as long as the test does.
      - path: _test\.go
        linters:
          - gosec
          - noctx
      # A fake server's writes and a test's closing of what it opened: if
      # one fails, an assertion fails with it.
      - path: _test\.go
        linters:
          - errcheck
        text: '`(io\.WriteString|[\w.]+\.(Write|Close))` is not checked'

formatters:
  enable:
    - gofmt

issues:
  # Report everything, not the first few of each kind.
  max-issues-per-linter: 0
  max-same-issues: 0
